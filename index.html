<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Who Am I? — Coraline Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif;color:#ffffff}.game{width:min(760px,100%);margin:auto;padding:24px;background:transparent}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{margin:0;font-size:34px;font-weight:800}.subtitle{margin:4px 0 0;color:#f3d86b}.badge{display:inline-block;border-radius:999px;padding:7px 12px;background:#e8dcef;font-size:13px;font-weight:800}.clues{display:grid;gap:10px;margin:20px 0}.clue{background:rgba(35,24,45,.88);border:1px solid #8d7898;color:#ffffff;border-radius:15px;padding:15px 17px;font-size:17px}.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}.option{min-height:54px;border:1px solid #cfc5d4;background:rgba(35,24,45,.88);border-radius:14px;color:#ffffff;padding:12px 15px;font:inherit;font-weight:700;cursor:pointer;text-align:left}.option:hover{border-color:#f3d86b;transform:translateY(-2px)}.option.correct{background:#dff0e2;border-color:#6b9b74}.option.wrong{background:#f4dddd;border-color:#c68181}.message{min-height:28px;margin-top:16px;font-weight:700}.next,.restart{border-radius:14px;padding:12px 19px;font:inherit;font-weight:800;cursor:pointer}.next{border:0;background:#6f4b80;color:white}.restart{margin-top:14px;border:1px solid #cfc5d4;background:rgba(35,24,45,.88)}@media(max-width:560px){.game{padding:16px}.title{font-size:28px}.options{grid-template-columns:1fr}}
</style></head><body><div class="game" id="game"><div class="top"><div><h1 class="title">🕷️ Who Am I?</h1><p class="subtitle">Coraline Edition</p></div><div class="badge" id="score">⭐ 0 / 6</div></div><div class="badge" id="number">CHARACTER 1 OF 6</div><div class="clues" id="clues"></div><div class="options" id="options"></div><div class="message" id="message" aria-live="polite"></div><button class="next" id="next" hidden>Next character →</button><br><button class="restart" id="restart">↻ Start again</button></div>
<script>
const qs=[
['Coraline',['I am a curious and brave girl.','I move into a new house with my parents.','I discover a mysterious little door.'],['Coraline','Wybie','The Cat','The Other Mother']],
['The Other Mother',['I look like Coraline’s mother.','I have buttons instead of eyes.','I want Coraline to stay with me forever.'],['The Other Mother','Miss Spink','Coraline','The Other Father']],
['The Cat',['I am mysterious and independent.','I can talk in the Other World.','I help Coraline when she is in danger.'],['Wybie','The Cat','Mr. Bobinsky','The Other Father']],
['Wybie',['I live near Coraline.','I have a grandmother who owns an old house.','I become Coraline’s friend and help her.'],['Wybie','The Cat','Mr. Bobinsky','The Other Mother']],
['Miss Spink',['I am Coraline’s neighbour.','I live with Miss Forcible.','I have many Scottish terriers.'],['Miss Spink','Miss Forcible','Coraline','The Other Mother']],
['Mr. Bobinsky',['I am one of Coraline’s neighbours.','I am very energetic and athletic.','I perform with trained mice.'],['Wybie','Mr. Bobinsky','The Cat','The Other Father']]
];
let i=0,score=0,locked=false;const $=id=>document.getElementById(id);
function render(){locked=false;let q=qs[i];$('number').textContent=`CHARACTER ${i+1} OF 6`;$('score').textContent=`⭐ ${score} / 6`;$('message').textContent='';$('next').hidden=true;$('clues').innerHTML=q[1].map((x,n)=>`<div class="clue">🔎 <b>Clue ${n+1}:</b> ${x}</div>`).join('');$('options').innerHTML='';q[2].forEach(x=>{let b=document.createElement('button');b.className='option';b.textContent=x;b.onclick=()=>choose(b,x);$('options').appendChild(b)})}
function choose(b,x){if(locked)return;if(x===qs[i][0]){locked=true;score++;b.classList.add('correct');$('message').textContent='🎉 Correct! It’s '+x+'!';$('score').textContent=`⭐ ${score} / 6`;$('options').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').hidden=false}else{b.classList.add('wrong');b.disabled=true;$('message').textContent='❌ Try again!'}}
$('next').onclick=()=>{if(i<5){i++;render()}else{$('number').textContent='🎃 GAME COMPLETE';$('clues').innerHTML='<div class="clue" style="text-align:center;font-size:20px">🔐 You found all the characters!</div>';$('options').innerHTML='';$('message').textContent=`⭐ Final score: ${score} / 6`;$('next').hidden=true}};$('restart').onclick=()=>{i=0;score=0;render()};render();
</script></body></html>
